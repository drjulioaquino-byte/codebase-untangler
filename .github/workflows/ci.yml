name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to full commit SHAs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest==8.3.5
      - name: Bundle matches source
        run: python tools/build_bundle.py --check
      - name: No hidden Unicode in text files
        run: |
          python - <<'EOF'
          import pathlib, sys, unicodedata
          bad = []
          for p in pathlib.Path(".").rglob("*"):
              if ".git" in p.parts or not p.is_file() or p.suffix == ".skill":
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for i, ch in enumerate(text):
                  if ord(ch) > 127 and unicodedata.category(ch) in ("Cf", "Co", "Cs"):
                      bad.append(f"{p}: U+{ord(ch):04X} at offset {i}")
          print("\n".join(bad) or "OK: no hidden format characters")
          sys.exit(1 if bad else 0)
          EOF
      - name: Tests
        run: python -m pytest -q tests
